elasticsearchHosts: "http://elasticsearch-master:9200"

replicas: 1

service:
  type: ClusterIP
  port: 5601

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
  extraEnvs:
  - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
    value: "MySuperSecureEncryptionKeyForKibana123456"
